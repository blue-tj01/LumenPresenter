# Tests every pull request on Windows and Linux. Each push to main also builds the installers, which can be
# downloaded from the run to try. Pushing a tag such as v0.3.0 (matching "version" in package.json) publishes them
# as a GitHub release, which installed copies of Lumen update from.
name: Build

on:
  pull_request:
  push:
    branches: [main]
    tags: ['v*']

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write # only used to publish a release from a tag
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24 # the version package.json asks for (engines), so CI tests what Lumen runs on
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run lint
      - run: npm run format:check
      - run: npm run typecheck

      # The console in a real browser: writing a song, going live, two operators at once, backups.
      - name: Install Chromium for the browser tests
        if: runner.os == 'Linux'
        run: npx playwright install --with-deps chromium
      - name: Browser tests
        if: runner.os == 'Linux'
        run: npm run test:e2e

      - name: Check the tag matches package.json
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          version=$(node -p "require('./package.json').version")
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "Tag $GITHUB_REF_NAME does not match package.json version $version"; exit 1
          fi

      - name: Build installers
        if: github.ref == 'refs/heads/main'
        run: npm run dist
      - name: Build and publish the release
        if: startsWith(github.ref, 'refs/tags/v')
        run: npm run release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/upload-artifact@v7
        if: github.event_name == 'push'
        with:
          name: lumen-${{ runner.os }}
          path: |
            dist/*.exe
            dist/*.AppImage
            dist/*.deb
          if-no-files-found: error
          retention-days: 14

  # The Bitfocus Companion module, packaged for Companion's "Import module package". Added to the release on a tag.
  companion:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write # only used to add the package to a release from a tag
    defaults:
      run:
        working-directory: companion-module
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: companion-module/package-lock.json
      - run: npm ci
      - run: npm run build
      - name: Name the package
        run: mv pkg.tgz "lumen-presenter-companion-$(node -p "require('./package.json').version").tgz"
      - name: Add it to the release
        if: startsWith(github.ref, 'refs/tags/v')
        run: gh release upload "$GITHUB_REF_NAME" lumen-presenter-companion-*.tgz --clobber
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/upload-artifact@v7
        with:
          name: lumen-presenter-companion
          path: companion-module/lumen-presenter-companion-*.tgz
          if-no-files-found: error
          retention-days: 14
