<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Audience Output</title>
<link rel="stylesheet" href="render.css">
<style>
  html, body { margin: 0; height: 100%; background: #000; overflow: hidden; cursor: none; }
  #screen { position: fixed; inset: 0; }
  #hint { position: fixed; top: 12px; left: 50%; transform: translateX(-50%); background: rgba(30,34,44,.9); color: #cfd6e4;
    font: 13px "Segoe UI", sans-serif; padding: 6px 14px; border-radius: 6px; transition: opacity .6s; cursor: default; }
</style>
</head>
<body>
<div id="screen"></div>
<div id="hint">Double-click or press F to go full screen</div>
<script src="render.js"></script>
<script src="sync.js"></script>
<script>
  const screen = PP.createScreen(document.getElementById('screen'));
  const hint = document.getElementById('hint');
  let hintTimer;
  const showHint = (text, ms) => { hint.textContent = text; hint.style.opacity = 1; clearTimeout(hintTimer); if (ms) hintTimer = setTimeout(() => hint.style.opacity = 0, ms); };
  // Browsers only play sound once someone has clicked in the window, so a video that started silently says so.
  const onMuted = v => {
    showHint('Click here to turn on video sound');
    document.addEventListener('click', () => { v.muted = false; hint.style.opacity = 0; }, { once: true });
  };
  Lumen.on('state', d => PP.update(screen, d.live, { fade: true, sound: true, onMuted }));
  Lumen.init().then(online => { if (!online) Lumen.hello(); });
  const fs = () => document.fullscreenElement ? document.exitFullscreen() : document.documentElement.requestFullscreen();
  document.ondblclick = fs;
  document.onkeydown = e => { if (e.key === 'f' || e.key === 'F') fs(); };
  // The desktop app opens it already full screen on its display (output.html?display).
  if (new URLSearchParams(location.search).has('display')) hint.style.opacity = 0;
  else showHint('Double-click or press F to go full screen', 3500);
</script>
</body>
</html>
